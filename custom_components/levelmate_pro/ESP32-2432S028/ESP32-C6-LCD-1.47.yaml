esphome:
  name: levelmate_display
  friendly_name: LevelMate Display
#  platformio_options:
#    board_build.flash_mode: dio
#    board_build.f_flash: 40000000L
#    board_build.flash_size: 4MB
#    upload_speed: 921600
#    build_unflags:
#      - "-Werror=all"
  on_boot:
    priority: -100
    then:
      - light.turn_on:
          id: backlight
          brightness: 50%

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret ble_relay_enc
  on_client_connected:
    - esp32_ble_tracker.start_scan:
        continuous: true
  on_client_disconnected:
    - esp32_ble_tracker.stop_scan:

safe_mode:

packages:
  common: !include display/common-nw.yaml

logger:
  level: DEBUG

globals:
  - id: lm_side_raw
    type: int16_t
    restore_value: no
    initial_value: '0'
  - id: lm_front_raw
    type: int16_t
    restore_value: no
    initial_value: '0'
  - id: lm_have_side
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: lm_have_front
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: go_power_rx_buffer
    type: std::string
    restore_value: false
    initial_value: '""'
    
esp32_ble:
  io_capability: keyboard_only
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    active: true

#bluetooth_proxy:
#  active: true
#  connection_slots: 3


ble_client:
  - mac_address: !secret levelmate_mac
    id: levelmate_ble
    auto_connect: true
    on_connect:
      then:
        - binary_sensor.template.publish:
            id: levelmate_connected
            state: ON
    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: levelmate_connected
            state: OFF
           
spi:
  id: spi_display
  clk_pin: GPIO7
  mosi_pin: GPIO6

output:
  - platform: ledc
    pin: GPIO22
    id: backlight_pwm
    frequency: 1000 Hz
    inverted: false

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON

  - platform: esp32_rmt_led_strip
    name: "Status LED"
    id: front_led
    pin: GPIO8
    rgb_order: RGB
    chipset: WS2812
    num_leds: 1
    restore_mode: ALWAYS_OFF

display:
  - platform: mipi_spi
    id: cyd_display
    model: ST7789V
    spi_id: spi_display
    cs_pin: GPIO14
    dc_pin:
      number: GPIO15
      ignore_strapping_warning: true
    reset_pin: GPIO21
    dimensions:
      width: 172
      height: 320
      offset_width: 34
      offset_height: 0
    invert_colors: true
    auto_clear_enabled: false
    update_interval: never

sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s

  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa13-0000-1000-8000-00805f9b34fb"
    id: levelmate_side_ble
    name: "Raw Side Reading"
    notify: true
    update_interval: never
    unit_of_measurement: "in"
    accuracy_decimals: 2
    icon: mdi:axis-y-arrow
    lambda: |-
      if (x.size() != 2)
        return NAN;

      int16_t raw =
          static_cast<int16_t>(
              static_cast<uint16_t>(x[0]) |
              (static_cast<uint16_t>(x[1]) << 8)
          );

      id(lm_side_raw) = raw;
      id(lm_have_side) = true;

      return raw * 0.25f;
    on_value:
      then:
        - if:
            condition:
              switch.is_on: levelmate_connection
            then:
              - script.execute: calculate_levelmate

  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa14-0000-1000-8000-00805f9b34fb"
    id: levelmate_front_ble
    name: "Raw Front Reading"
    notify: true
    update_interval: never
    unit_of_measurement: "in"
    accuracy_decimals: 2
    icon: mdi:axis-x-arrow
    lambda: |-
      if (x.size() != 2)
        return NAN;

      int16_t raw =
          static_cast<int16_t>(
              static_cast<uint16_t>(x[0]) |
              (static_cast<uint16_t>(x[1]) << 8)
          );

      id(lm_front_raw) = raw;
      id(lm_have_front) = true;

      return raw * 0.25f;
    on_value:
      then:
        - if:
            condition:
              switch.is_on: levelmate_connection
            then:
              - script.execute: calculate_levelmate

  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa20-0000-1000-8000-00805f9b34fb"
    id: levelmate_temperature
    name: "Temperature"
    notify: true
    update_interval: never
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    lambda: |-
      if (x.size() != 4)
        return NAN;

      uint32_t bits =
          static_cast<uint32_t>(x[0]) |
          (static_cast<uint32_t>(x[1]) << 8) |
          (static_cast<uint32_t>(x[2]) << 16) |
          (static_cast<uint32_t>(x[3]) << 24);

      float value;
      memcpy(&value, &bits, sizeof(value));
      return value;

  - platform: template
    name: "Driver Front Corner"
    id: driver_front
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute

  - platform: template
    name: "Passenger Front Corner"
    id: passenger_front
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute

  - platform: template
    name: "Driver Back Corner"
    id: driver_back
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute

  - platform: template
    name: "Passenger Back Corner"
    id: passenger_back
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute

  - platform: ble_client
    type: rssi
    ble_client_id: levelmate_ble
    name: "Bluetooth RSSI"
    update_interval: 30s
    entity_category: diagnostic

switch:
  - platform: ble_client
    ble_client_id: levelmate_ble
    name: "LevelMate Bluetooth"
    id: levelmate_connection

button:
  - platform: safe_mode
    name: "Safe Mode"

  - platform: template
    name: "LevelMate Remove Bond"
    entity_category: diagnostic
    on_press:
      - ble_client.remove_bond:
          id: levelmate_ble

binary_sensor:
  - platform: status
    id: system_status
    name: "System Status"
  - platform: template
    name: "LevelMate Connected"
    id: levelmate_connected
    device_class: connectivity

text_sensor:
  - platform: template
    name: "Reference Corner"
    id: reference_corner
    icon: mdi:axis-arrow

