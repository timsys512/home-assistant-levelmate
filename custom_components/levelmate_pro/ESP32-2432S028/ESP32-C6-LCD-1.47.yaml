script:
  - id: calculate_levelmate
    mode: restart
    then:
      - lambda: |-
          if (!id(lm_have_side) || !id(lm_have_front))
            return;

          const int16_t side_raw = id(lm_side_raw);
          const int16_t front_raw = id(lm_front_raw);

          const float side_in = static_cast<float>(side_raw) * 0.25f;
          const float front_in = static_cast<float>(front_raw) * 0.25f;

          const float abs_side = fabsf(side_in);
          const float abs_front = fabsf(front_in);
          const float diagonal = abs_side + abs_front;

          float df;
          float pf;
          float db;
          float pb;

          const bool high_front = front_raw < 0;
          const bool side_positive = side_raw > 0;

          if (high_front && side_positive) {
            df = 0.0f;
            pf = abs_side;
            db = abs_front;
            pb = diagonal;
            id(reference_corner).publish_state("Driver Front");
          } else if (high_front && !side_positive) {
            pf = 0.0f;
            df = abs_side;
            pb = abs_front;
            db = diagonal;
            id(reference_corner).publish_state("Passenger Front");
          } else if (!high_front && side_positive) {
            db = 0.0f;
            pb = abs_side;
            df = abs_front;
            pf = diagonal;
            id(reference_corner).publish_state("Driver Back");
          } else {
            pb = 0.0f;
            db = abs_side;
            pf = abs_front;
            df = diagonal;
            id(reference_corner).publish_state("Passenger Back");
          }

          id(driver_front).publish_state(df);
          id(passenger_front).publish_state(pf);
          id(driver_back).publish_state(db);
          id(passenger_back).publish_state(pb);

          lv_label_set_text(id(driver_front_label), str_sprintf("%.2f", df).c_str());
          lv_label_set_text(id(passenger_front_label), str_sprintf("%.2f", pf).c_str());
          lv_label_set_text(id(driver_back_label), str_sprintf("%.2f", db).c_str());
          lv_label_set_text(id(passenger_back_label), str_sprintf("%.2f", pb).c_str());
