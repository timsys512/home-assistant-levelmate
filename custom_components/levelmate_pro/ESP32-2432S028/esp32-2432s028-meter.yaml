esphome:
  name: esphome-levemlate
  friendly_name: LevelMate Display
  platformio_options:
    board_build.flash_mode: dio
    board_build.f_flash: 40000000L
    board_build.f_cpu: 240000000L
    board_build.flash_size: 4MB
    upload_speed: 921600
    build_unflags:
      - "-Werror=all"

safe_mode:

ota:
  - platform: esphome
    password: !secret ota_password

substitutions:
  name: levelmate-esp32
  friendly_name: "LevelMate Display"
  levelmate_mac: !secret levelmate_mac

esp32:
  board: esp32dev
  framework:
    type: esp-idf

globals:
  - id: lm_side_raw
    type: int16_t
    restore_value: no
    initial_value: '0'

  - id: lm_front_raw
    type: int16_t
    restore_value: no
    initial_value: '0'

  - id: lm_have_side
    type: bool
    restore_value: no
    initial_value: 'false'

  - id: lm_have_front
    type: bool
    restore_value: no
    initial_value: 'false'
    
bluetooth_proxy:

esp32_ble_tracker:
  scan_parameters:
    active: true

ble_client:
  - mac_address: ${levelmate_mac}
    id: levelmate_ble
    auto_connect: true

    on_connect:
      then:
        - binary_sensor.template.publish:
            id: levelmate_connected
            state: ON

    on_disconnect:
      then:
        - binary_sensor.template.publish:
            id: levelmate_connected
            state: OFF

esp32_ble:
  io_capability: keyboard_only
  disable_bt_logs: true  # Default, saves flash
  connection_timeout: 20s  # Default, matches client timeout
  max_connections: 4

packages:
  common: !include common-nw.yaml

api:
  encryption:
    key: !secret ble_relay_enc
  reboot_timeout: 15min

spi:
  - id: spi_display
    clk_pin: GPIO14
    mosi_pin: GPIO13
    miso_pin: GPIO12
  - id: spi_touch
    clk_pin: GPIO25
    mosi_pin: GPIO32
    miso_pin: GPIO39    

output:
  - platform: ledc
    pin: GPIO21
    id: backlight_pwm
    frequency: 1000 Hz
    inverted: false
  - platform: ledc
    pin: GPIO04
    id: led_red
    inverted: true
  - platform: ledc
    pin: GPIO17
    id: led_blue
    inverted: true
  - platform: ledc
    pin: GPIO16
    id: led_green
    inverted: true

light:
  - platform: monochromatic
    output: backlight_pwm
    name: "Display Backlight"
    id: backlight
    restore_mode: ALWAYS_ON
  - platform: rgb
    name: "Status LED"
    id: front_led
    restore_mode: ALWAYS_OFF
    red: led_red
    green: led_green
    blue: led_blue

display:
  - platform: ili9xxx
    id: cyd_display
    model: ILI9341
    spi_id: spi_display
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 240
      height: 320
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: true
    invert_colors: false
    auto_clear_enabled: false
    update_interval: never   

touchscreen:
  - platform: xpt2046
    id: cyd_touch
    spi_id: spi_touch
    cs_pin: GPIO33
    interrupt_pin: GPIO36
    update_interval: 50ms
    threshold: 400
    calibration:
      x_min: 280
      x_max: 3860
      y_min: 340
      y_max: 3860
    transform:
      mirror_x: false
      mirror_y: true
      swap_xy: false

sensor:
  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa13-0000-1000-8000-00805f9b34fb"
    id: levelmate_side_ble
    name: "Raw Side Reading"
    notify: true
    update_interval: never
    unit_of_measurement: "in"
    accuracy_decimals: 2
    icon: mdi:axis-y-arrow
    lambda: |-
      if (x.size() != 2)
        return NAN;

      int16_t raw =
          static_cast<int16_t>(
              static_cast<uint16_t>(x[0]) |
              (static_cast<uint16_t>(x[1]) << 8)
          );

      id(lm_side_raw) = raw;
      id(lm_have_side) = true;

      return raw * 0.25f;
    on_value:
      then:
        - script.execute: calculate_levelmate
  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa14-0000-1000-8000-00805f9b34fb"
    id: levelmate_front_ble
    name: "Raw Front Reading"
    notify: true
    update_interval: never
    unit_of_measurement: "in"
    accuracy_decimals: 2
    icon: mdi:axis-x-arrow
    lambda: |-
      if (x.size() != 2)
        return NAN;

      int16_t raw =
          static_cast<int16_t>(
              static_cast<uint16_t>(x[0]) |
              (static_cast<uint16_t>(x[1]) << 8)
          );

      id(lm_front_raw) = raw;
      id(lm_have_front) = true;

      return raw * 0.25f;
    on_value:
      then:
  - platform: ble_client
    type: characteristic
    ble_client_id: levelmate_ble
    service_uuid: "0000aa10-0000-1000-8000-00805f9b34fb"
    characteristic_uuid: "0000aa20-0000-1000-8000-00805f9b34fb"
    id: levelmate_temperature
    name: "Temperature"
    notify: true
    update_interval: never
    device_class: temperature
    state_class: measurement
    unit_of_measurement: "°F"
    accuracy_decimals: 1
    lambda: |-
      if (x.size() != 4)
        return NAN;

      uint32_t bits =
          static_cast<uint32_t>(x[0]) |
          (static_cast<uint32_t>(x[1]) << 8) |
          (static_cast<uint32_t>(x[2]) << 16) |
          (static_cast<uint32_t>(x[3]) << 24);

      float value;
      memcpy(&value, &bits, sizeof(value));

      return value;
  - platform: template
    name: "Driver Front Corner"
    id: driver_front
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute
  - platform: template
    name: "Passenger Front Corner"
    id: passenger_front
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute
  - platform: template
    name: "Driver Back Corner"
    id: driver_back
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute
  - platform: template
    name: "Passenger Back Corner"
    id: passenger_back
    unit_of_measurement: "in"
    accuracy_decimals: 2
    state_class: measurement
    icon: mdi:angle-acute
  - platform: ble_client
    type: rssi
    ble_client_id: levelmate_ble
    name: "Bluetooth RSSI"
    update_interval: 30s
    entity_category: diagnostic

switch:
  - platform: ble_client
    ble_client_id: levelmate_ble
    name: "Bluetooth Connection"
    id: levelmate_connection
button:
  - platform: safe_mode
    name: "Safe Mode"
binary_sensor:
  - platform: status
    id: system_status
    name: "System Status"
  - platform: template
    name: "Connected"
    id: levelmate_connected
    device_class: connectivity
    
text_sensor:
  - platform: template
    name: "Reference Corner"
    id: reference_corner
    icon: mdi:axis-arrow

lvgl:
  log_level: WARN
  displays:
    - cyd_display
  buffer_size: 12%
  touchscreens:
    - touchscreen_id: cyd_touch
  theme:
