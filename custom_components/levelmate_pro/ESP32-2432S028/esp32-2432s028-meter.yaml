                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: 50%
                  height: 100
                  width: 100
                  align: CENTER
                  scrollable: false
                  border_width: 0
                  pad_all: 0
                  widgets:
                    - label:
                        id: l_1_pp
                        align: CENTER
                        text_align: CENTER
                        text_font: roboto_sm
                        text: "LevelMate Pro"
              - obj:
                  grid_cell_row_pos: 1
                  grid_cell_column_pos: 0
                  grid_cell_column_span: 2
                  text_color: 0xFFFFFF
                  grid_cell_x_align: STRETCH
                  grid_cell_y_align: STRETCH
                  bg_opa: 50%
                  height: 100
                  width: 100
                  align: CENTER
                  scrollable: false
